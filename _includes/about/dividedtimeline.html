<div class="timeline-body bg-themed">

  <div class="timeline-header">
    <div class="timeline-label left">Education</div>
    <div class="timeline-label right">Experience</div>
  </div>

  {% for item in site.data.timeline %}
    <div class="timeline-item {{ item.category }}">
      
      <div class="timeline-year">
          {{ item.from }}
        </div>
      
      <div class="content">
        <h2>{{ item.title }}</h2>

        <h6 class="date">
          {{ item.from }} —
          {% if item.to == 9999 %}
            Present
          {% else %}
            {{ item.to }}
          {% endif %}
        </h6>
        
        <p>{{ item.description }}</p>
      </div>
    </div>
  {% endfor %}

</div>
