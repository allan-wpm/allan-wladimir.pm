<div class="timeline-body bg-themed">

  <div class="timeline-header">
    <div class="timeline-label left">Education</div>
    <div class="timeline-label right">Experience</div>
  </div>

  {% for item in site.data.tl_education %}
    <div class="timeline-item {{ item.category }}">
      <div class="content">
        <h2>{{ item.title }}</h2>
        <h6 class="date">{{ item.from }} — {{ item.to }}</h6>
        <p>{{ item.description }}</p>
      </div>
    </div>
  {% endfor %}

</div>
