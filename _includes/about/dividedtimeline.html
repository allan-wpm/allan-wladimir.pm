<div class="timeline-body bg-themed">

  <div class="timeline-header">
    <div class="timeline-label left">Education</div>
    <div class="timeline-label right">Experience</div>
  </div>

  

  {% assign timeline = site.data.timeline | sort: "to" | reverse %}

  {% assign years = timeline | map: "to" | uniq %}

  {% for year in years %}

    <div class="timeline-row">

      <div class="timeline-year">
        {% if year == 9999 %}
          Present
        {% else %}
          {{ year }}
        {% endif %}
      </div>

    </div>
