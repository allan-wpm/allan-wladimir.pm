### Site Settings ###
title               : Allan Wladimir (Peñafiel-Mera)
description         : Transport Researcher 
url                 : "https://allan-wladimir.pm"
baseurl             : ""            # Change to empty quotes if you are hosting your site at <your-username>.github.io directly
repository          : allan-wpm/allan-wladimir.pm      # Change to <your-username>/<your-username>.github.io (or remove it if you don't need remote projects)

remote_theme        : yousinix/portfolYOU

open_new_tab        : false                    # Opens external URLs in new tab (works for posts, projects and navbar only)


### Plugins ###
plugins:
 - jemoji


### Navbar Settings ###
nav_exclude:                                            # The following paths are excluded from navbar
  - pages/tags.html
  - pages/404.html
  - pages/index.md
  - pages/trajectory.md
  

